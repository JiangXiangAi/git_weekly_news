name: Render weekly report PDFs

on:
  push:
    branches: [main]
    paths:
      - '2026/**/*.md'
      - '.github/scripts/render_reports.py'
      - '.github/workflows/render-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install CJK font and renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install reportlab
      - name: Render PDFs
        run: python .github/scripts/render_reports.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '2026/2026-10-05_2026-10-11/*.pdf'
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build week 41 report PDFs"
            git push
          fi
